<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>交易提醒</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="每日策略進出場提醒">
<meta property="og:title" content="交易提醒">
<meta property="og:description" content="每日策略進出場提醒">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="交易提醒">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#16181d; --dim:#6b7280; --line:#e5e7eb;
  --buy:#d92d20; --buy-bg:#fef3f2; --sell:#047857; --sell-bg:#ecfdf5;
  --warn:#b45309; --warn-bg:#fffbeb; --accent:#1d4ed8;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115; --card:#171a21; --ink:#e8eaed; --dim:#9aa1ac; --line:#272b33;
    --buy:#ff6b5e; --buy-bg:#2a1512; --sell:#34d399; --sell-bg:#0d2019;
    --warn:#fbbf24; --warn-bg:#241c08; --accent:#7aa2ff;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans TC",system-ui,sans-serif;
  padding:0 0 48px;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:14px 0 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:19px;margin:0;letter-spacing:.02em}
h2{font-size:15px;margin:26px 0 10px;color:var(--dim);font-weight:600;letter-spacing:.08em}
.status{font-size:13px;color:var(--dim);margin-top:6px;display:flex;
  align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sell);flex:none}
.dot.bad{background:var(--buy)} .dot.warn{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:10px}
.card.buy{border-left:4px solid var(--buy)}
.card.sell{border-left:4px solid var(--sell)}
.card.soon{border-left:4px solid var(--warn);background:var(--warn-bg)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;
  border-radius:999px;letter-spacing:.05em}
.tag.buy{color:var(--buy);background:var(--buy-bg)}
.tag.sell{color:var(--sell);background:var(--sell-bg)}
.tag.warn{color:var(--warn);background:var(--warn-bg)}
.name{font-size:18px;font-weight:700;margin:8px 0 2px}
.code{font-variant-numeric:tabular-nums;color:var(--dim);font-weight:500}
.meta{font-size:13px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;margin-top:12px}
label.chk{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;user-select:none}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
input[type=text],input[type=email],input[type=password],input[type=number],
input[type=date],select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
button{font:inherit;font-weight:600;border:1px solid var(--line);cursor:pointer;
  background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px}
button.primary{background:var(--accent);color:#fff;border-color:transparent;
  width:100%;padding:12px}
button.small{padding:6px 11px;font-size:13px}
.empty{color:var(--dim);font-size:14px;padding:18px 2px}
.days{font-weight:700;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid label,.fld label{font-size:13px;color:var(--dim);display:block;margin-bottom:4px}
.fld{margin-bottom:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;
  background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;
  font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
#login,#setup{max-width:360px;margin:14vh auto 0;padding:0 20px}
#login .card,#setup .card{padding:22px}
#login h1,#setup h1{margin-bottom:4px}
#login p,#setup p{color:var(--dim);font-size:14px;margin:0 0 18px}
#login input,#setup input{margin-bottom:10px}
.err{color:var(--buy);font-size:14px;margin-top:10px}
hr{border:0;border-top:1px solid var(--line);margin:26px 0 0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
details summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ ";color:var(--accent)}
details[open] summary::before{content:"− "}
details[open] summary{margin-bottom:14px}
</style>
</head>
<body>

<div id="setup" hidden>
  <div class="card">
    <h1>交易提醒</h1>
    <p>第一次使用，請貼上 Supabase 的 publishable key（只需要設定一次，會存在這台裝置的瀏覽器裡）</p>
    <input id="key" type="text" placeholder="sb_publishable_... 或 eyJ...">
    <button class="primary" id="btnKey">儲存</button>
  </div>
</div>

<div id="login" hidden>
  <div class="card">
    <h1>交易提醒</h1>
    <p>請登入</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="密碼" autocomplete="current-password">
    <button class="primary" id="btnLogin">登入</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="hrow">
        <h1>交易提醒</h1>
        <div style="display:flex;gap:8px">
          <button class="small" id="btnRefresh">重新整理</button>
          <button class="small" id="btnRun">更新資料</button>
        </div>
      </div>
      <div class="status" id="status"></div>
    </div>
  </header>

  <div class="wrap">
    <h2 id="actionTitle">明日行動</h2>
    <div id="actions"></div>

    <h2>近期行事曆</h2>
    <div id="calendar"></div>

    <h2>進行中部位</h2>
    <div id="holding"></div>

    <hr>
    <h2>手動新增</h2>
    <details id="addBox">
      <summary>新增事件（0050／MSCI 查到名單後填這裡）</summary>
      <div class="fld">
        <label>策略</label>
        <select id="fStrategy"></select>
      </div>
      <div class="grid">
        <div class="fld"><label>股票代號</label>
          <input id="fCode" type="text" inputmode="numeric" placeholder="2345"></div>
        <div class="fld"><label>名稱</label>
          <input id="fName" type="text" placeholder="智邦"></div>
      </div>
      <div class="fld"><label>事件日（公布日）</label>
        <input id="fEvent" type="date"></div>
      <div class="grid">
        <div class="fld"><label>進場日</label><input id="fEntry" type="date"></div>
        <div class="fld"><label>出場日</label><input id="fExit" type="date"></div>
      </div>
      <p class="meta" id="fHint" style="margin:0 0 12px"></p>
      <button class="primary" id="btnAdd">新增</button>
    </details>

    <hr>
    <h2>策略設定</h2>
    <div id="strategies"></div>
    <p class="empty">改參數只影響之後新產生的訊號，已經存在的訊號和部位不會變動。</p>

    <p class="empty" style="text-align:center">
      <button class="small" id="btnLogout">登出</button>
    </p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
