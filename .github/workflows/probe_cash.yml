name: 探測現增資料

# 暫時性：以 DRY_RUN 掃最近 45 天的現增公告，確認 004 解析結果，確認後刪除。
on:
  push:
    branches: [claude/strategy-trigger-tracking-dccm6s]
    paths: [.github/workflows/probe_cash.yml, scripts/cash_issue.py]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 004 DRY_RUN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: '1'
          DAYS: '45'

        run: python3 scripts/cash_issue.py
