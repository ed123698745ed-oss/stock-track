name: 每日訊號推播

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只印訊息、不推 LINE（填 1）'
        required: false
        default: '0'
      late:
        description: '補推模式：只推還沒推過的新訊號（填 1）'
        required: false
        default: '0'
      force:
        description: '強制重推完整主推播（今天已推過也送；填 1，只限手動檢查用）'
        required: false
        default: '0'
  schedule:
    # 主推播 19:30：排在處置股、庫藏股抓取（cron-job.org 19:05、19:20）之後
    - cron: '30 11 * * 1-5'   # 台北 19:30
    # 補推：只推還沒推過的新訊號（晚到的重大訊息／處置股補跑、融資餘額 → 020）
    - cron: '7 13 * * 1-5'    # 台北 21:07
    - cron: '37 14 * * 1-5'   # 台北 22:37

permissions:
  contents: read

# cron-job.org 19:35 與 GitHub 排程 19:30 可能同時在跑：排成一個接一個，
# 第二個跑到推播時就看得到第一個的紀錄，不會兩個同時推出主推播。
concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # GitHub 自帶排程有時延遲好幾小時（曾在隔天清晨 05:41 才跑）。
      # 排程觸發時只在台北 19:00~23:59 執行，太晚就整個略過；cron-job.org 手動觸發不受限。
      # 2026-10-25：10/22 的 19:30 排程延遲到 23:59 才開始，推播在 10/23 00:03 送出，
      # 被當成 10/23 的主推播，導致 10/23 晚上的主推播被防重複規則擋掉。
      # 修正：①記下開始執行時的台北日期（RUN_DAY），推播一律以它為「今天」；
      #       ②主推播排程（19:30）過了 23:00 才開始就略過，避免跑到午夜後。補推排程維持 19～23 點。
      - name: 時間檢查
        id: gate
        run: |
          h=$(TZ=Asia/Taipei date +%H)
          echo "run_day=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"
          last=23
          [ "${{ github.event.schedule }}" = "30 11 * * 1-5" ] && last=22
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$h" -lt 19 ] || [ "$h" -gt "$last" ]; }; then
            echo "排程延遲到台北 ${h} 點才執行，略過"; echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 抓今日行情（上市＋上櫃收盤、漲跌停、融資）
        if: steps.gate.outputs.go == '1'
        id: market
        continue-on-error: true
        run: python3 scripts/market.py

      - name: 事件型策略（A08、014、010、020）
        if: steps.gate.outputs.go == '1'
        id: event
        continue-on-error: true
        run: python3 scripts/event_signals.py

      - name: 現增策略（004、017）
        if: steps.gate.outputs.go == '1'
        id: cash
        continue-on-error: true
        run: python3 scripts/cash_issue.py

      - name: 內部人申報轉讓（019）
        if: steps.gate.outputs.go == '1'
        id: insider
        continue-on-error: true
        run: python3 scripts/insider.py

      - name: 大幅除權息（A11）
        if: steps.gate.outputs.go == '1'
        id: exright
        continue-on-error: true
        run: python3 scripts/exright.py

      - name: A11 配股可賣日（LT185／櫃買公告）
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/exright_delivery.py

      - name: 日曆型策略（A01、A09、A10、009、021）
        if: steps.gate.outputs.go == '1'
        id: cal
        continue-on-error: true
        run: python3 scripts/calendar_signals.py

      - name: 處置股（A02：首日收盤買→處置最後一天收盤賣，只做 5／7 日處置）
        if: steps.gate.outputs.go == '1'
        id: disposal
        continue-on-error: true
        run: python3 scripts/disposal_signals.py

      # 換股公告多在盤後（最晚見過 18:03）、隔天開盤就要進場：推播前先查一次重大訊息
      - name: 分割換股日程（重大訊息，上市／上櫃／興櫃）
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/split_mops.py

      - name: 分割（A06，依總表：公告後首個可成交開盤買→新股上市第5日收盤賣）
        if: steps.gate.outputs.go == '1'
        id: split
        continue-on-error: true
        run: python3 scripts/split_signals.py

      # 庫藏股（A03）：舊看板 signals 同步到 strategy_actions，推播與改期都走新版
      - name: 庫藏股同步（A03）
        if: steps.gate.outputs.go == '1'
        id: buyback
        continue-on-error: true
        run: python3 scripts/buyback_actions.py

      - name: 推播 LINE
        if: steps.gate.outputs.go == '1'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          MARKET_OUTCOME: ${{ steps.market.outcome }}
          EVENT_OUTCOME: ${{ steps.event.outcome }}
          CAL_OUTCOME: ${{ steps.cal.outcome }}
          CASH_OUTCOME: ${{ steps.cash.outcome }}
          INSIDER_OUTCOME: ${{ steps.insider.outcome }}
          EXRIGHT_OUTCOME: ${{ steps.exright.outcome }}
          DISPOSAL_OUTCOME: ${{ steps.disposal.outcome }}
          SPLIT_OUTCOME: ${{ steps.split.outcome }}
          BUYBACK_OUTCOME: ${{ steps.buyback.outcome }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          RUN_DAY: ${{ steps.gate.outputs.run_day }}
          FORCE: ${{ github.event.inputs.force || '0' }}
          LATE: ${{ (github.event.schedule == '7 13 * * 1-5' || github.event.schedule == '37 14 * * 1-5' || github.event.inputs.late == '1') && '1' || '0' }}
        run: python3 scripts/daily_push.py
