name: 探測增資股上市公告

# 暫時性：DRY_RUN 驗證 004＋017（現增比例 100 天、上市公告 3 個月），確認後刪除。
on:
  push:
    branches: [claude/strategy-trigger-tracking-dccm6s]
    paths: [.github/workflows/probe_017.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 004＋017 DRY_RUN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: '1'
          DAYS: '70'
          PERIOD017: '4'
        run: python3 scripts/cash_issue.py
