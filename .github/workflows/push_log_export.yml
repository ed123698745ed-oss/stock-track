name: 匯出推播紀錄

# 每週彙整任務會觸發這個，讀 log 後寫進 Drive 的 05_Emit工作紀錄。
on:
  workflow_dispatch:
    inputs:
      days:
        description: '往回幾天'
        required: false
        default: '7'
      raw:
        description: "1＝另輸出原文 JSON"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DAYS: ${{ github.event.inputs.days }}
      RAW: ${{ github.event.inputs.raw }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/export_push_log.py | tee out.txt
      - name: 原文 JSON 推到暫存分支（RAW=1 時；Actions 日誌連不到時取用，取完刪分支）
        if: github.event.inputs.raw == '1'
        run: |
          sed -n '/===RAW===/,/===RAWEND===/p' out.txt | sed '1d;$d' > /tmp/raw.json
          git config user.name github-actions; git config user.email actions@github.com
          git checkout --orphan tmp-push-export
          git rm -rfq . ; cp /tmp/raw.json raw.json; git add raw.json
          git commit -qm "推播紀錄原文匯出（暫存）"; git push -f origin tmp-push-export
