name: 唯讀診斷（訊號日期）

# 只讀不寫：列出期間內 strategy_actions、signals、disposals，核對休市順延等日期問題。
on:
  workflow_dispatch:
    inputs:
      from:
        description: '起日（例 2026-10-15，空白＝今天前 10 天）'
        required: false
        default: ''
      to:
        description: '迄日（空白＝今天後 14 天）'
        required: false
        default: ''
      ex_from:
        description: 'A11 核對：除權息日起（例 2026-10-28，空白＝不查）'
        required: false
        default: ''
      ex_to:
        description: 'A11 核對：除權息日迄'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      FROM: ${{ github.event.inputs.from }}
      TO: ${{ github.event.inputs.to }}
      EX_FROM: ${{ github.event.inputs.ex_from }}
      EX_TO: ${{ github.event.inputs.ex_to }}
    steps:
      - uses: actions/checkout@v4
      - run: cd scripts && python3 diag_dates.py | tee /tmp/diag.txt
      - name: 結果推到暫存分支 tmp-diag（給連不到 Actions 日誌的環境取用）
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git checkout --orphan tmp-diag
          git rm -rfq .
          cp /tmp/diag.txt .
          git add -A; git commit -qm "診斷輸出（暫存）"; git push -f origin tmp-diag
