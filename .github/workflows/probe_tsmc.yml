name: 探測台積電法說日

# 暫時性：推到開發分支時以 DRY_RUN 跑日曆策略，確認法說日自動抓取，確認後刪除。
on:
  push:
    branches: [claude/strategy-trigger-tracking-dccm6s]
    paths: [.github/workflows/probe_tsmc.yml, scripts/calendar_signals.py]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 日曆策略 DRY_RUN
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: '1'
        run: python3 scripts/calendar_signals.py
