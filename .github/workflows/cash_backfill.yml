name: 回補現增公告

# 第一次使用跑一次：017 要比對「當初認股基準日公告」的每仟股認購股數，
# 公告常在新股上市前 1~3 個月，每晚只掃 7 天不夠；先回補 120 天存進 cash_issues。
on:
  workflow_dispatch:
    inputs:
      days:
        description: '往回掃幾天重大訊息'
        required: false
        default: '120'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DAYS: ${{ github.event.inputs.days }}
      PERIOD017: '5'
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/cash_issue.py
