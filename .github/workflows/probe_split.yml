name: 臨時查核
on:
  push:
    branches: [claude/strategy-trigger-tracking-dccm6s]
    paths: [.github/workflows/probe_split.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DRY_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/split_mops.py
      - run: python3 -u scripts/split_signals.py
