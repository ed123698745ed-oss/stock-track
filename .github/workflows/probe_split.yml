name: 臨時查核
on:
  push:
    branches: [claude/strategy-trigger-tracking-dccm6s]
    paths: [probe/**, .github/workflows/probe_split.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: DRY_RUN=1 python3 -u scripts/disposal_signals.py
