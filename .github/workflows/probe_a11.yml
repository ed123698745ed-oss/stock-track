name: 探測 A11
on:
  push:
    branches: [claude/strategy-trigger-tracking-dccm6s]
    paths: [scripts/exright.py, .github/workflows/probe_a11.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DRY_RUN: '1'
      PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/exright.py
