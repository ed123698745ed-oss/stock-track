name: 驗證修正（只讀）
on:
  push:
    branches: [claude/strategy-trigger-tracking-dccm6s]
    paths: [.github/workflows/verify_fix.yml, probe/**]
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      DRY_RUN: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/p6980.py
      - run: python3 scripts/event_signals.py
      - run: python3 scripts/insider.py
      - run: python3 scripts/cash_issue.py
      - run: python3 scripts/daily_push.py
