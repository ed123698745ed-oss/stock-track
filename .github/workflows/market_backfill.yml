name: 回補歷史行情

# 第一次使用跑一次：020 每檔要先有 120 個有效行情日，加上穿越判斷、二次群聚的前 20 日，
# 回補起點至少要比第一個判斷日早約 160 個交易日；直接回補一年以上（預設 300）。
# 已存在的日子會略過，中斷了重跑即可接續。
on:
  workflow_dispatch:
    inputs:
      days:
        description: '往回補幾個交易日'
        required: false
        default: '300'
      refetch:
        description: '已存在的日子也重抓（修正解析後用，填 1）'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 回補
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL: ${{ github.event.inputs.days || '300' }}
          REFETCH: ${{ github.event.inputs.refetch || '0' }}
        run: python3 scripts/market.py
      - name: 用回補的資料檢查事件型策略（只印不寫）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: '1'
        run: python3 scripts/event_signals.py
