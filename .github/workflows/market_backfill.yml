name: 回補歷史行情

# 第一次使用跑一次：020 需要每檔超過 120 個有效行情日的融資餘額。
# 已存在的日子會略過，中斷了重跑即可接續。
on:
  workflow_dispatch:
    inputs:
      days:
        description: '往回補幾個交易日'
        required: false
        default: '160'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 回補
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL: ${{ github.event.inputs.days || '160' }}
        run: python3 scripts/market.py
      - name: 用回補的資料檢查事件型策略（只印不寫）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: '1'
        run: python3 scripts/event_signals.py
