name: 更新休市日

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 1 * *'      # 每月 1 日台北 09:00
    - cron: '0 1 * * 1'      # 每週一台北 09:00：年底前要早點把隔年休市日收進來，訊號才不會跨年算不出日期

jobs:
  holidays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓 TWSE 休市日並重算訊號日期
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, time, urllib.request, urllib.error

          SUPA = os.environ["SUPABASE_URL"].strip().rstrip("/")
          KEY  = os.environ["SUPABASE_SERVICE_KEY"].strip()

          def supa(path, method="POST", payload=None, prefer="return=representation"):
              req = urllib.request.Request(
                  f"{SUPA}/rest/v1/{path}",
                  data=json.dumps(payload).encode("utf-8") if payload is not None else None,
                  headers={"apikey": KEY, "Authorization": f"Bearer {KEY}",
                           "Content-Type": "application/json", "Prefer": prefer},
                  method=method)
              last = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=40) as r:
                          body = r.read()
                          return json.loads(body) if body.strip() else None
                  except urllib.error.HTTPError as e:
                      last = f"{e.code}: {e.read()[:200]!r}"
                      if e.code in (502, 503, 504):
                          time.sleep(3 * (attempt + 1)); continue
                      raise RuntimeError(f"Supabase {method} {path} -> {last}")
                  except Exception as e:
                      last = f"{type(e).__name__}: {e}"
                      time.sleep(3 * (attempt + 1))
              raise RuntimeError(f"Supabase {method} {path} 重試三次仍失敗 -> {last}")

          url = "https://openapi.twse.com.tw/v1/holidaySchedule/holidaySchedule"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=40) as r:
              data = json.loads(r.read().decode("utf-8"))
          print(f"TWSE 回傳 {len(data)} 筆")

          rows, skipped = [], []
          for it in data:
              roc  = (it.get("Date") or "").strip()
              name = (it.get("Name") or "").strip()
              if not re.fullmatch(r"\d{7}", roc):
                  skipped.append((roc or "?", name, "日期格式不符")); continue
              # TWSE 這張表混了「開始交易日 / 最後交易日」這種『有開盤』的註記，要排除。
              # 注意不能只比對「交易」二字——「市場無交易，僅辦理結算交割作業」是真的休市。
              if any(k in name for k in ("開始交易", "最後交易", "交易日")):
                  skipped.append((roc, name, "這天有開盤，不是休市日")); continue
              rows.append({"market_date": f"{int(roc[:3])+1911}-{roc[3:5]}-{roc[5:7]}",
                           "name": name[:100]})

          rows = list({r["market_date"]: r for r in rows}.values())
          rows.sort(key=lambda x: x["market_date"])

          print(f"\n判定為休市日：{len(rows)} 天")
          for r in rows:
              print("   ", r["market_date"], r["name"])
          print(f"\n排除：{len(skipped)} 筆")
          for roc, name, why in skipped:
              print("   ", roc, name, "→", why)

          # 合理性檢查：台股一年的休市日（不含週末）約 18~30 天，逐年檢查。
          # 數量異常代表 TWSE 改了資料格式或我的過濾失效，寧可不寫也不要汙染資料庫。
          # （年底 TWSE 可能同時回傳今年與明年，總數會超過 40，所以不能用總數檢查）
          by_year = {}
          for r in rows:
              by_year.setdefault(r["market_date"][:4], []).append(r)
          print("\n各年度休市日：" + "、".join(f"{y} 年 {len(v)} 天" for y, v in sorted(by_year.items())))
          bad = {y: len(v) for y, v in by_year.items() if not (15 <= len(v) <= 40)}
          if bad:
              raise SystemExit(f"休市日數量不在合理範圍(15~40)：{bad}，判斷資料格式可能有變，不寫入")

          # 這次新加入、且在今天前後 60 天內的休市日（例：證交所事後補進颱風假）→ 下一步要幫策略訊號改期
          import datetime as _dt
          _today = _dt.date.today()
          _have = {h["market_date"] for h in (supa("holidays?select=market_date&limit=5000", "GET") or [])}
          _new = [r["market_date"] for r in rows if r["market_date"] not in _have
                  and abs((_dt.date.fromisoformat(r["market_date"]) - _today).days) <= 60
                  and _dt.date.fromisoformat(r["market_date"]).weekday() < 5]
          open("/tmp/new_holidays", "w").write(" ".join(_new))
          print(f"新加入的近期休市日：{_new or '無'}")

          # 已在表裡的日期不覆蓋：臨時休市（自動／手動登錄）名稱含「臨時／颱風」，A02 處置迄日順延要靠它判斷
          rows = [r for r in rows if r["market_date"] not in _have]
          print(f"要新寫入 {len(rows)} 天（已存在的不覆蓋）")

          # 分批寫入，避免一次太多觸發 504
          for i in range(0, len(rows), 10):
              batch = rows[i:i+10]
              supa("holidays", "POST", batch,
                   prefer="resolution=merge-duplicates,return=minimal")
              print(f"已寫入 {i+len(batch)}/{len(rows)}")

          n = supa("rpc/recalc_signal_dates", "POST", {})
          print(f"\n重算後有 {n} 筆訊號的進出場日被修正")

          have = sorted({r["market_date"][:4] for r in supa("holidays?select=market_date&limit=5000", "GET")})
          print(f"holidays 表目前有的年份：{have}")
          nxt_year = str(__import__("datetime").date.today().year + 1)
          if nxt_year not in have:
              print(f"⚠ {nxt_year} 年休市日還沒入庫：跨年的訊號（例如 A10 長榮航出場、009 統領進場）算不出日期，"
                    f"TWSE 公布後請再跑一次本工作流程")

          nxt = supa("v_next_actions?select=company_code,company_name,action,entry_date,exit_date", "GET")
          print(f"明日行動清單: {len(nxt or [])} 筆")
          for r in (nxt or []):
              print("   ", r)
          PYEOF

      # 新版策略訊號（strategy_actions）依新加入的休市日改期（同「新增休市日」）
      - name: 策略訊號改期
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          D=$(cat /tmp/new_holidays 2>/dev/null || true)
          if [ -n "$D" ]; then cd scripts && python3 reschedule.py $D; else echo "沒有新加入的近期休市日，略過改期"; fi
